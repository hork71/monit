<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSMON — Infrastructure Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg:          #f6f3ec;
      --surface:     #ffffff;
      --border:      rgba(38, 52, 68, 0.09);
      --shadow-sm:   rgba(38, 52, 68, 0.10);
      --shadow-md:   rgba(38, 52, 68, 0.14);
      --text:        #263444;
      --text-muted:  #7a93a8;
      --text-dim:    #afc0ce;

      --green:       #1e9e5e;
      --green-fill:  rgba(30, 158, 94,  0.10);
      --green-halo:  rgba(30, 158, 94,  0.07);
      --red:         #d4243a;
      --red-fill:    rgba(212, 36,  58,  0.10);
      --red-halo:    rgba(212, 36,  58,  0.07);

      --cenbo-bg:     #263444;
      --cenbo-fg:     #f6f3ec;

      --puppet:      #1565a0;
      --puppet-lt:   rgba(21, 101, 160, 0.09);
      --gitlab:      #b84400;
      --gitlab-lt:   rgba(184, 68,  0,   0.09);
      --suma:        #286b50;
      --suma-lt:     rgba(40, 107, 80,  0.09);

      --font-display: 'Syne', sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
    }

    /* ── Background texture ──────────────────────────────────────────────────── */

    .dot-grid {
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(38,52,68,0.07) 1px, transparent 1px);
      background-size: 26px 26px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ──────────────────────────────────────────────────────────────── */

    header {
      position: relative;
      z-index: 10;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow:
        0 1px 0 rgba(38,52,68,0.05),
        0 2px 16px rgba(38,52,68,0.07);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-icon { width: 32px; height: 32px; flex-shrink: 0; }

    .brand-name {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      line-height: 1;
    }

    .brand-name em { color: var(--puppet); font-style: normal; }

    .brand-sub {
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .stat-label {
      font-size: 7.5px;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .stat-val {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .stat-val.puppet { color: var(--puppet); }
    .stat-val.gitlab { color: var(--gitlab); }
    .stat-val.suma   { color: var(--suma);   }

    .hdivider {
      width: 1px;
      height: 26px;
      background: var(--border);
    }

    .conn {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .conn-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(30,158,94,0.18);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .conn-dot.off {
      background: var(--red);
      box-shadow: 0 0 0 3px rgba(212,36,58,0.18);
      animation: blink 1.1s ease-in-out infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* ── Main layout ─────────────────────────────────────────────────────────── */

    main {
      flex: 1;
      position: relative;
      z-index: 1;
      overflow: hidden;
      display: flex;
      flex-direction: row;
    }

    /* ── Graph area ──────────────────────────────────────────────────────────── */

    #graph-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #chart {
      width: 100%; height: 100%;
      display: block;
      cursor: grab;
    }

    #chart:active { cursor: grabbing; }

    /* ── Loading overlay ─────────────────────────────────────────────────────── */

    .loading {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
      background: var(--bg);
      transition: opacity 0.5s ease;
    }

    .loading.hidden { opacity: 0; pointer-events: none; }

    .loading-ring {
      width: 46px; height: 46px;
      border: 2px solid var(--border);
      border-top-color: var(--puppet);
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 9.5px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ── Legend ──────────────────────────────────────────────────────────────── */

    .legend {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
      align-items: center;
      padding: 7px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      box-shadow:
        0 2px 6px var(--shadow-sm),
        0 1px 2px var(--shadow-md);
      z-index: 20;
      white-space: nowrap;
    }

    .legend-sep {
      width: 1px;
      height: 14px;
      background: var(--border);
      margin: 0 2px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .pip {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid transparent;
    }

    /* ── Tooltip ─────────────────────────────────────────────────────────────── */

    #tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.12s;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 14px;
      box-shadow:
        0 4px 12px var(--shadow-sm),
        0 1px 4px var(--shadow-md);
      min-width: 155px;
    }

    #tooltip.show { opacity: 1; }

    .tt-name {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-bottom: 3px;
    }

    .tt-group {
      font-size: 8.5px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .tt-node {
      font-size: 10px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 2px;
    }

    .tt-port {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .tt-status {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }

    .tt-status.up   { color: var(--green); }
    .tt-status.down { color: var(--red);   }

    /* ── SVG node animations ─────────────────────────────────────────────────── */

    @keyframes pulse-down {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.40; }
    }

    .unavail-pulse { animation: pulse-down 1.6s ease-in-out infinite; }

    /* ── Event log panel ─────────────────────────────────────────────────────── */

    #event-log {
      width: 268px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: -2px 0 12px rgba(38,52,68,0.05);
    }

    .log-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 14px;
      height: 38px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .log-title {
      font-size: 8px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
      flex: 1;
    }

    .log-count {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 7px;
      min-width: 22px;
      text-align: center;
    }

    .log-clear {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 10px;
      color: var(--text-dim);
      padding: 3px 5px;
      border-radius: 3px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }

    .log-clear:hover { color: var(--red); background: rgba(212,36,58,0.07); }
    .log-clear:active { background: rgba(212,36,58,0.14); }
    .log-clear:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

    .log-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .log-body::-webkit-scrollbar { width: 4px; }
    .log-body::-webkit-scrollbar-track { background: transparent; }
    .log-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .log-empty {
      padding: 32px 16px;
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      line-height: 1.8;
    }

    @keyframes log-slide-in {
      from { transform: translateY(-6px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .log-entry {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
      animation: log-slide-in 0.22s cubic-bezier(0.34, 1.2, 0.64, 1) both;
      position: relative;
    }

    .log-entry:last-child { border-bottom: none; }

    .log-accent {
      width: 3px;
      flex-shrink: 0;
    }

    .log-entry.up   .log-accent { background: var(--green); }
    .log-entry.down .log-accent { background: var(--red); }

    .log-content {
      flex: 1;
      padding: 9px 12px 9px 11px;
      min-width: 0;
    }

    .log-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 3px;
    }

    .log-service {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .log-time {
      font-size: 9px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .log-mid {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 2px;
    }

    .log-group-tag {
      font-size: 7.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .log-sep-dot {
      width: 2px; height: 2px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }

    .log-direction {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .log-entry.up   .log-direction { color: var(--green); }
    .log-entry.down .log-direction { color: var(--red); }

    .log-host {
      font-size: 8.5px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="dot-grid"></div>

  <header>
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14.5" stroke="rgba(38,52,68,0.16)" stroke-width="1"/>
        <circle cx="16" cy="16" r="9"    stroke="rgba(38,52,68,0.24)" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5"  fill="#263444"/>
        <line x1="16" y1="1.5"  x2="16" y2="7"    stroke="#1565a0" stroke-width="1.5"/>
        <line x1="16" y1="25"   x2="16" y2="30.5"  stroke="rgba(38,52,68,0.20)" stroke-width="1"/>
        <line x1="1.5" y1="16"  x2="7"  y2="16"   stroke="rgba(38,52,68,0.20)" stroke-width="1"/>
        <line x1="25"  y1="16"  x2="30.5" y2="16"  stroke="rgba(38,52,68,0.20)" stroke-width="1"/>
      </svg>
      <div>
        <div class="brand-name">SYS<em>MON</em></div>
        <div class="brand-sub">Infrastructure Monitor</div>
      </div>
    </div>

    <div class="header-right">
      <div class="stat">
        <span class="stat-label">Puppet</span>
        <span class="stat-val puppet" id="puppet-count">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">GitLab</span>
        <span class="stat-val gitlab" id="gitlab-count">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Suma</span>
        <span class="stat-val suma" id="suma-count">—</span>
      </div>
      <div class="hdivider"></div>
      <div class="stat">
        <span class="stat-label">Last Check</span>
        <span class="stat-val" id="last-check">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Interval</span>
        <span class="stat-val">10 s</span>
      </div>
      <div class="hdivider"></div>
      <div class="conn">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-label">connecting</span>
      </div>
    </div>
  </header>

  <main>
    <div id="graph-area">
      <svg id="chart"></svg>

      <div class="loading" id="loading">
        <div class="loading-ring"></div>
        <div class="loading-text">Running diagnostics…</div>
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="pip" style="border-color:var(--puppet);background:var(--puppet-lt);"></div>
          Puppet
        </div>
        <div class="legend-item">
          <div class="pip" style="border-color:var(--gitlab);background:var(--gitlab-lt);"></div>
          GitLab
        </div>
        <div class="legend-item">
          <div class="pip" style="border-color:var(--suma);background:var(--suma-lt);"></div>
          Suma
        </div>
        <div class="legend-sep"></div>
        <div class="legend-item">
          <div class="pip" style="border-color:var(--green);background:var(--green-fill);"></div>
          Available
        </div>
        <div class="legend-item">
          <div class="pip" style="border-color:var(--red);background:var(--red-fill);"></div>
          Unavailable
        </div>
        <div class="legend-sep"></div>
        <div class="legend-item" style="color:var(--text-dim);">
          drag to reposition
        </div>
      </div>
    </div>

    <aside id="event-log">
      <div class="log-header">
        <span class="log-title">Status Changes</span>
        <span class="log-count" id="log-count">0</span>
        <button class="log-clear" id="log-clear" title="Clear log">✕</button>
      </div>
      <div class="log-body" id="log-body">
        <div class="log-empty" id="log-empty">Monitoring for changes…</div>
      </div>
    </aside>
  </main>

  <div id="tooltip">
    <div class="tt-name"   id="tt-name"></div>
    <div class="tt-group"  id="tt-group"></div>
    <div class="tt-node"   id="tt-node"></div>
    <div class="tt-port"   id="tt-port"></div>
    <div class="tt-status" id="tt-status"></div>
  </div>

  <script>
    // ── Design constants ─────────────────────────────────────────────────────
    const COLORS = {
      green:     '#1e9e5e',
      greenFill: 'rgba(30,158,94,0.10)',
      greenHalo: 'rgba(30,158,94,0.07)',
      red:       '#d4243a',
      redFill:   'rgba(212,36,58,0.10)',
      redHalo:   'rgba(212,36,58,0.07)',
    };

    const GROUP_META = {
      puppet: { color: '#1565a0', fill: 'rgba(21,101,160,0.09)',  name: 'PUPPET' },
      gitlab: { color: '#b84400', fill: 'rgba(184,68,0,0.09)',    name: 'GITLAB' },
      suma:   { color: '#286b50', fill: 'rgba(40,107,80,0.09)',   name: 'SUMA'   },
    };

    function getGroupMeta(id) {
      return GROUP_META[id] || { color: '#4a6080', fill: 'rgba(74,96,128,0.09)', name: id.toUpperCase() };
    }

    const R = { root: 44, group: 30, nodehost: 22, service: 16 };
    function nodeRadius(d) { return R[d.type] ?? R.service; }

    // ── Build D3 graph data from WebSocket status groups ─────────────────────
    // groups shape: { groupName: { nodeName: [ { name, node, port, protocol, available } ] } }
    function buildGraph(groups) {
      const rootNode    = [{ id: 'cenbo', type: 'root' }];
      const groupNodes  = [];
      const nhNodes     = [];
      const svcNodes    = [];
      const links       = [];
      const nodeMap     = new Map();

      Object.entries(groups).forEach(([gName, gNodes]) => {
        const meta = getGroupMeta(gName);
        groupNodes.push({ id: gName, type: 'group', meta, label: meta.name });
        links.push({ source: 'cenbo', target: gName, linkType: 'root-group' });

        Object.entries(gNodes).forEach(([nodeName, services]) => {
          const nhId = `${gName}:${nodeName}`;
          nhNodes.push({ id: nhId, type: 'nodehost', group: gName, meta, nodeName });
          links.push({ source: gName, target: nhId, linkType: 'group-node', groupColor: meta.color });

          services.forEach(svc => {
            const id = `${gName}:${nodeName}:${svc.name}`;
            svcNodes.push({ id, type: 'service', group: gName, nodehost: nhId, meta,
                            protocol: svc.protocol ?? 'TCP', ...svc });
            links.push({ source: nhId, target: id, linkType: 'node-service', groupColor: meta.color });
          });
        });
      });

      const nodes = [...rootNode, ...groupNodes, ...nhNodes, ...svcNodes];
      nodes.forEach(n => nodeMap.set(n.id, n));
      return { nodes, links, nodeMap };
    }

    // ── Seed positions for fast simulation convergence ────────────────────────
    function seedPositions(graph) {
      const cenbo = graph.nodeMap.get('cenbo');
      cenbo.x = W / 2; cenbo.y = H / 2;
      cenbo.fx = W / 2; cenbo.fy = H / 2;

      const groups = graph.nodes.filter(n => n.type === 'group');
      groups.forEach((g, i) => {
        const angle = (i / groups.length) * 2 * Math.PI - Math.PI / 2;
        g.x = W / 2 + Math.cos(angle) * 215;
        g.y = H / 2 + Math.sin(angle) * 215;
      });

      graph.nodes.filter(n => n.type === 'nodehost').forEach(n => {
        const g = graph.nodeMap.get(n.group);
        const angle = Math.random() * 2 * Math.PI;
        n.x = (g?.x ?? W / 2) + Math.cos(angle) * 120;
        n.y = (g?.y ?? H / 2) + Math.sin(angle) * 120;
      });

      graph.nodes.filter(n => n.type === 'service').forEach(n => {
        const nh = graph.nodeMap.get(n.nodehost);
        const angle = Math.random() * 2 * Math.PI;
        n.x = (nh?.x ?? W / 2) + Math.cos(angle) * 75;
        n.y = (nh?.y ?? H / 2) + Math.sin(angle) * 75;
      });
    }

    // ── Graph state ──────────────────────────────────────────────────────────
    let svg, graphLayer;
    let W = 0, H = 0;
    let rendered = false;
    let lastGroups = null;
    let currentGraph = null;
    let simulation = null;

    let linkSel, nodeSel;
    let cenboPingEl = null;
    const svcCircleRefs     = new Map();
    const svcHaloRefs       = new Map();
    const groupBadgeRefs    = new Map();
    const nodehostBadgeRefs = new Map();

    // ── Collapse state ───────────────────────────────────────────────────────
    const collapsedGroups       = new Set();
    const groupCircleRefs       = new Map();
    const groupIndicatorRefs    = new Map();
    const collapsedNodehosts    = new Set();
    const nodehostCircleRefs    = new Map();
    const nodehostIndicatorRefs = new Map();

    // ── Event log state ──────────────────────────────────────────────────────
    // Maps serviceId → last known available state for delta detection
    const prevStatusMap = new Map();
    let logEntryCount = 0;
    const MAX_LOG_ENTRIES = 120;

    // ── Initialise SVG canvas ────────────────────────────────────────────────
    function initSVG() {
      const graphArea = document.getElementById('graph-area');
      W = graphArea.clientWidth;
      H = graphArea.clientHeight;

      svg = d3.select('#chart').attr('width', W).attr('height', H);

      const defs = svg.append('defs');

      const f = defs.append('filter')
        .attr('id', 'node-shadow')
        .attr('x', '-40%').attr('y', '-40%')
        .attr('width', '180%').attr('height', '180%');
      f.append('feDropShadow')
        .attr('dx', 0).attr('dy', 2)
        .attr('stdDeviation', 4)
        .attr('flood-color', 'rgba(38,52,68,0.13)');

      svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#f6f3ec');

      graphLayer = svg.append('g').attr('class', 'graph-layer');
    }

    // ── Drag: pin while dragging, release on drop (root stays pinned) ────────
    function makeDrag(sim) {
      return d3.drag()
        .on('start', (ev, d) => {
          if (!ev.active) sim.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
        .on('end', (ev, d) => {
          if (!ev.active) sim.alphaTarget(0);
          const keepPinned = d.type === 'root'
            || collapsedGroups.has(d.id)
            || collapsedNodehosts.has(d.id);
          if (!keepPinned) { d.fx = null; d.fy = null; }
        });
    }

    // ── Render full graph ────────────────────────────────────────────────────
    function renderGraph(graph) {
      svcCircleRefs.clear();
      svcHaloRefs.clear();
      groupBadgeRefs.clear();
      nodehostBadgeRefs.clear();
      groupCircleRefs.clear();
      groupIndicatorRefs.clear();
      nodehostCircleRefs.clear();
      nodehostIndicatorRefs.clear();
      collapsedGroups.clear();
      collapsedNodehosts.clear();
      cenboPingEl = null;
      graphLayer.selectAll('*').remove();

      if (simulation) simulation.stop();

      simulation = d3.forceSimulation(graph.nodes)
        .force('link', d3.forceLink(graph.links)
          .id(d => d.id)
          .distance(d => {
            if (d.linkType === 'root-group') return 220;
            if (d.linkType === 'group-node') return 140;
            return 90;
          })
          .strength(d => {
            if (d.linkType === 'root-group') return 0.45;
            if (d.linkType === 'group-node') return 0.60;
            return 0.75;
          }))
        .force('charge', d3.forceManyBody()
          .strength(d => ({ root: -700, group: -500, nodehost: -280, service: -130 }[d.type] ?? -130)))
        .force('center', d3.forceCenter(W / 2, H / 2).strength(0.04))
        .force('collide', d3.forceCollide()
          .radius(d => nodeRadius(d) + 18).strength(0.88))
        .alphaDecay(0.013)
        .on('tick', ticked);

      linkSel = graphLayer.append('g')
        .selectAll('line')
        .data(graph.links)
        .enter().append('line')
        .attr('stroke', d => {
          if (d.linkType === 'root-group') return 'rgba(38,52,68,0.13)';
          if (d.linkType === 'group-node') return d.groupColor + '55';
          return d.groupColor + '35';
        })
        .attr('stroke-width', d => {
          if (d.linkType === 'root-group') return 1.5;
          if (d.linkType === 'group-node') return 1.2;
          return 0.9;
        })
        .attr('stroke-linecap', 'round');

      nodeSel = graphLayer.append('g')
        .selectAll('g')
        .data(graph.nodes)
        .enter().append('g')
        .attr('class', d => `node node-${d.type}`)
        .call(makeDrag(simulation));

      // ── ROOT / cenbo ───────────────────────────────────────────────────────
      const cenboG = nodeSel.filter(d => d.type === 'root');

      cenboG.append('circle')
        .attr('r', R.root)
        .attr('fill', 'none')
        .attr('stroke', '#263444')
        .attr('stroke-width', 1.5)
        .attr('opacity', 0)
        .each(function() { cenboPingEl = d3.select(this); });

      cenboG.append('circle')
        .attr('r', R.root + 8)
        .attr('fill', 'rgba(38,52,68,0.05)')
        .attr('stroke', 'none');

      cenboG.append('circle')
        .attr('r', R.root)
        .attr('fill', '#263444')
        .attr('filter', 'url(#node-shadow)');

      cenboG.append('text')
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('font-family', "'Syne', sans-serif")
        .attr('font-size', 13)
        .attr('font-weight', '800')
        .attr('letter-spacing', '0.18em')
        .attr('fill', '#f6f3ec')
        .attr('pointer-events', 'none')
        .text('cenbo');

      // ── GROUP nodes ───────────────────────────────────────────────────────
      const groupG = nodeSel.filter(d => d.type === 'group');

      // Click-to-collapse behaviour
      groupG
        .style('cursor', 'pointer')
        .on('click', (ev, d) => { ev.stopPropagation(); toggleGroup(d.id); });

      groupG.append('circle')
        .attr('r', R.group + 8)
        .attr('fill', d => d.meta.color + '18')
        .attr('stroke', 'none');

      const groupCircles = groupG.append('circle')
        .attr('r', R.group)
        .attr('fill', d => d.meta.fill)
        .attr('stroke', d => d.meta.color)
        .attr('stroke-width', 2.5)
        .attr('filter', 'url(#node-shadow)');

      groupCircles.each(function(d) { groupCircleRefs.set(d.id, d3.select(this)); });

      groupG.append('text')
        .attr('y', -5)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('font-family', "'Syne', sans-serif")
        .attr('font-size', 7.5)
        .attr('font-weight', '800')
        .attr('letter-spacing', '0.09em')
        .attr('fill', d => d.meta.color)
        .attr('pointer-events', 'none')
        .text(d => d.label);

      const countTexts = groupG.append('text')
        .attr('y', 9)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('font-family', "'JetBrains Mono', monospace")
        .attr('font-size', 8)
        .attr('font-weight', '600')
        .attr('fill', d => d.meta.color)
        .attr('opacity', 0.55)
        .attr('pointer-events', 'none')
        .text('—');

      countTexts.each(function(d) { groupBadgeRefs.set(d.id, d3.select(this)); });

      // Collapse chevron indicator (▾ = expanded, ▸ = collapsed)
      const chevrons = groupG.append('text')
        .attr('y', 20)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('font-family', "'JetBrains Mono', monospace")
        .attr('font-size', 8)
        .attr('fill', d => d.meta.color)
        .attr('opacity', 0.40)
        .attr('pointer-events', 'none')
        .text('▾');

      chevrons.each(function(d) { groupIndicatorRefs.set(d.id, d3.select(this)); });

      const tooltip = document.getElementById('tooltip');

      // ── NODEHOST nodes ────────────────────────────────────────────────────
      const nhG = nodeSel.filter(d => d.type === 'nodehost');

      nhG
        .style('cursor', 'pointer')
        .on('click', (ev, d) => { ev.stopPropagation(); toggleNodehost(d.id); });

      nhG.append('circle')
        .attr('r', R.nodehost + 5)
        .attr('fill', d => d.meta.color + '12')
        .attr('stroke', 'none');

      const nhCircles = nhG.append('circle')
        .attr('r', R.nodehost)
        .attr('fill', d => d.meta.fill)
        .attr('stroke', d => d.meta.color + 'aa')
        .attr('stroke-width', 1.5)
        .attr('stroke-dasharray', '4 2')
        .attr('filter', 'url(#node-shadow)');

      nhCircles.each(function(d) { nodehostCircleRefs.set(d.id, d3.select(this)); });

      nhG.append('text')
        .attr('y', -3)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('font-family', "'JetBrains Mono', monospace")
        .attr('font-size', 5.5)
        .attr('font-weight', '600')
        .attr('fill', d => d.meta.color)
        .attr('pointer-events', 'none')
        .text(d => d.nodeName);

      const nhBadges = nhG.append('text')
        .attr('y', 7)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('font-family', "'JetBrains Mono', monospace")
        .attr('font-size', 6.5)
        .attr('font-weight', '600')
        .attr('fill', d => d.meta.color)
        .attr('opacity', 0.50)
        .attr('pointer-events', 'none')
        .text('—');

      nhBadges.each(function(d) { nodehostBadgeRefs.set(d.id, d3.select(this)); });

      const nhChevrons = nhG.append('text')
        .attr('y', R.nodehost + 10)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'central')
        .attr('font-family', "'JetBrains Mono', monospace")
        .attr('font-size', 7)
        .attr('fill', d => d.meta.color)
        .attr('opacity', 0.38)
        .attr('pointer-events', 'none')
        .text('▾');

      nhChevrons.each(function(d) { nodehostIndicatorRefs.set(d.id, d3.select(this)); });

      nhG
        .on('mouseenter', (ev, d) => {
          const meta = getGroupMeta(d.group);
          document.getElementById('tt-name').textContent = d.nodeName;
          const grpEl = document.getElementById('tt-group');
          grpEl.textContent = meta.name; grpEl.style.color = meta.color;
          document.getElementById('tt-node').textContent = '';
          document.getElementById('tt-port').textContent = '';
          const services = currentGraph?.nodes.filter(n => n.type === 'service' && n.nodehost === d.id) ?? [];
          const upCount  = services.filter(n => n.available).length;
          const st = document.getElementById('tt-status');
          st.textContent = `${upCount} / ${services.length} services`;
          st.className   = `tt-status ${upCount === services.length ? 'up' : 'down'}`;
          tooltip.classList.add('show');
        })
        .on('mousemove', ev => {
          tooltip.style.left = `${ev.clientX + 16}px`;
          tooltip.style.top  = `${ev.clientY - 12}px`;
        })
        .on('mouseleave', () => tooltip.classList.remove('show'));

      // ── SERVICE nodes ─────────────────────────────────────────────────────
      const svcG = nodeSel.filter(d => d.type === 'service');

      const halos = svcG.append('circle')
        .attr('r', R.service + 6)
        .attr('fill', d => d.available ? COLORS.greenHalo : COLORS.redHalo)
        .attr('stroke', 'none');

      halos.each(function(d) { svcHaloRefs.set(d.id, d3.select(this)); });

      const circles = svcG.append('circle')
        .attr('r', R.service)
        .attr('fill', d => d.available ? COLORS.greenFill : COLORS.redFill)
        .attr('stroke', d => d.available ? COLORS.green : COLORS.red)
        .attr('stroke-width', 2)
        .attr('filter', 'url(#node-shadow)')
        .classed('unavail-pulse', d => !d.available);

      circles.each(function(d) { svcCircleRefs.set(d.id, d3.select(this)); });

      svcG.append('circle')
        .attr('r', 3)
        .attr('fill', d => d.available ? COLORS.green : COLORS.red)
        .attr('opacity', 0.6)
        .attr('pointer-events', 'none');

      svcG.append('text')
        .attr('y', R.service + 12)
        .attr('text-anchor', 'middle')
        .attr('font-family', "'JetBrains Mono', monospace")
        .attr('font-size', 9)
        .attr('font-weight', '500')
        .attr('fill', '#263444')
        .attr('opacity', 0.72)
        .attr('pointer-events', 'none')
        .text(d => d.name);

      svcG.append('text')
        .attr('y', R.service + 22)
        .attr('text-anchor', 'middle')
        .attr('font-family', "'JetBrains Mono', monospace")
        .attr('font-size', 7.5)
        .attr('fill', '#7a93a8')
        .attr('pointer-events', 'none')
        .text(d => `${d.protocol ?? 'TCP'}:${d.port}`);

      svcG
        .on('mouseenter', (ev, d) => {
          const live = currentGraph?.nodeMap.get(d.id);
          const av   = live ? live.available : d.available;
          const meta = getGroupMeta(d.group);
          document.getElementById('tt-name').textContent  = d.name;
          const grpEl = document.getElementById('tt-group');
          grpEl.textContent  = meta.name;
          grpEl.style.color  = meta.color;
          document.getElementById('tt-node').textContent  = d.node;
          document.getElementById('tt-port').textContent  = `${d.protocol ?? 'TCP'} :${d.port}`;
          const st = document.getElementById('tt-status');
          st.textContent = av ? '● ONLINE' : '● OFFLINE';
          st.className   = `tt-status ${av ? 'up' : 'down'}`;
          tooltip.classList.add('show');
        })
        .on('mousemove', ev => {
          tooltip.style.left = `${ev.clientX + 16}px`;
          tooltip.style.top  = `${ev.clientY - 12}px`;
        })
        .on('mouseleave', () => tooltip.classList.remove('show'));

      refreshGroupBadges(graph);
      refreshNodehostBadges(graph);
    }

    // ── Tick: clamp nodes to graph area bounds ────────────────────────────────
    function ticked() {
      // Anchor all descendants of collapsed groups to group center each tick
      collapsedGroups.forEach(groupId => {
        const g = currentGraph?.nodeMap.get(groupId);
        if (!g) return;
        currentGraph.nodes
          .filter(n => (n.type === 'nodehost' || n.type === 'service') && n.group === groupId)
          .forEach(n => { n.fx = g.x; n.fy = g.y; });
      });

      // Anchor service nodes under collapsed nodehosts (when parent group is expanded)
      collapsedNodehosts.forEach(nhId => {
        const nh = currentGraph?.nodeMap.get(nhId);
        if (!nh || collapsedGroups.has(nh.group)) return;
        currentGraph.nodes
          .filter(n => n.type === 'service' && n.nodehost === nhId)
          .forEach(n => { n.fx = nh.x; n.fy = nh.y; });
      });

      currentGraph?.nodes.forEach(n => {
        const r = nodeRadius(n) + 5;
        n.x = Math.max(r, Math.min(W - r, n.x));
        n.y = Math.max(r, Math.min(H - r, n.y));
      });

      linkSel.each(function(d) {
        const dx   = d.target.x - d.source.x;
        const dy   = d.target.y - d.source.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const nx   = dx / dist;
        const ny   = dy / dist;
        d3.select(this)
          .attr('x1', d.source.x + nx * nodeRadius(d.source))
          .attr('y1', d.source.y + ny * nodeRadius(d.source))
          .attr('x2', d.target.x - nx * nodeRadius(d.target))
          .attr('y2', d.target.y - ny * nodeRadius(d.target));
      });

      nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
    }

    // ── Group / nodehost badge counts ─────────────────────────────────────────
    function refreshGroupBadges(graph) {
      const counts = {};
      graph.nodes.filter(n => n.type === 'service').forEach(n => {
        if (!counts[n.group]) counts[n.group] = { up: 0, total: 0 };
        counts[n.group].total++;
        if (n.available) counts[n.group].up++;
      });
      Object.entries(counts).forEach(([g, c]) => {
        groupBadgeRefs.get(g)?.text(`${c.up}/${c.total}`);
      });
    }

    function refreshNodehostBadges(graph) {
      const counts = {};
      graph.nodes.filter(n => n.type === 'service').forEach(n => {
        if (!counts[n.nodehost]) counts[n.nodehost] = { up: 0, total: 0 };
        counts[n.nodehost].total++;
        if (n.available) counts[n.nodehost].up++;
      });
      Object.entries(counts).forEach(([nhId, c]) => {
        nodehostBadgeRefs.get(nhId)?.text(`${c.up}/${c.total}`);
      });
    }

    // ── Collapse / expand a group node ───────────────────────────────────────
    function toggleGroup(groupId) {
      const collapsed = !collapsedGroups.has(groupId);
      if (collapsed) collapsedGroups.add(groupId);
      else           collapsedGroups.delete(groupId);
      applyCollapsedState(groupId, collapsed);
    }

    function applyCollapsedState(groupId, collapsed) {
      const groupNode = currentGraph?.nodeMap.get(groupId);
      if (!groupNode) return;

      if (collapsed) {
        groupNode.fx = groupNode.x; groupNode.fy = groupNode.y;

        // Pin all descendants at group center
        currentGraph.nodes
          .filter(n => (n.type === 'nodehost' || n.type === 'service') && n.group === groupId)
          .forEach(n => { n.fx = groupNode.x; n.fy = groupNode.y; });

        // Hide nodehosts + services
        nodeSel.filter(d => (d.type === 'nodehost' || d.type === 'service') && d.group === groupId)
          .transition().duration(280).ease(d3.easeCubicInOut)
          .attr('opacity', 0).style('pointer-events', 'none');

        // Hide group-node and node-service links
        linkSel.filter(d => {
          const src = typeof d.source === 'object' ? d.source.id : d.source;
          if (d.linkType === 'group-node' && src === groupId) return true;
          if (d.linkType === 'node-service') {
            return currentGraph.nodeMap.get(src)?.group === groupId;
          }
          return false;
        }).transition().duration(280).attr('opacity', 0);

      } else {
        groupNode.fx = null; groupNode.fy = null;

        // Release nodehost nodes
        currentGraph.nodes
          .filter(n => n.type === 'nodehost' && n.group === groupId)
          .forEach(n => { n.fx = null; n.fy = null; });

        // Release service nodes (unless their nodehost is independently collapsed)
        currentGraph.nodes
          .filter(n => n.type === 'service' && n.group === groupId)
          .forEach(n => {
            if (collapsedNodehosts.has(n.nodehost)) {
              const nh = currentGraph.nodeMap.get(n.nodehost);
              if (nh) { n.fx = nh.x; n.fy = nh.y; }
            } else {
              n.fx = null; n.fy = null;
            }
          });

        // Show nodehosts
        nodeSel.filter(d => d.type === 'nodehost' && d.group === groupId)
          .transition().duration(280).ease(d3.easeCubicInOut)
          .attr('opacity', 1).style('pointer-events', null);

        // Show services (except those under a collapsed nodehost)
        nodeSel.filter(d => d.type === 'service' && d.group === groupId)
          .transition().duration(280).ease(d3.easeCubicInOut)
          .attr('opacity', d => collapsedNodehosts.has(d.nodehost) ? 0 : 1)
          .style('pointer-events', d => collapsedNodehosts.has(d.nodehost) ? 'none' : null);

        // Show group-node links
        linkSel.filter(d => d.linkType === 'group-node' &&
                            (typeof d.source === 'object' ? d.source.id : d.source) === groupId)
          .transition().duration(280).attr('opacity', 1);

        // Show node-service links for non-collapsed nodehosts
        linkSel.filter(d => {
          if (d.linkType !== 'node-service') return false;
          const src = typeof d.source === 'object' ? d.source.id : d.source;
          const nh  = currentGraph.nodeMap.get(src);
          return nh?.group === groupId && !collapsedNodehosts.has(src);
        }).transition().duration(280).attr('opacity', 1);

        simulation?.alpha(0.25).restart();
      }

      groupCircleRefs.get(groupId)?.attr('stroke-dasharray', collapsed ? '5 3' : null);
      groupIndicatorRefs.get(groupId)?.text(collapsed ? '▸' : '▾');
    }

    // ── Nodehost collapse ─────────────────────────────────────────────────────
    function toggleNodehost(nhId) {
      const collapsed = !collapsedNodehosts.has(nhId);
      if (collapsed) collapsedNodehosts.add(nhId);
      else           collapsedNodehosts.delete(nhId);
      applyNodehostCollapsedState(nhId, collapsed);
    }

    function applyNodehostCollapsedState(nhId, collapsed) {
      const nhNode = currentGraph?.nodeMap.get(nhId);
      if (!nhNode) return;

      if (collapsed) { nhNode.fx = nhNode.x; nhNode.fy = nhNode.y; }
      else           { nhNode.fx = null; nhNode.fy = null; }

      currentGraph.nodes
        .filter(n => n.type === 'service' && n.nodehost === nhId)
        .forEach(n => {
          if (collapsed) { n.fx = nhNode.x; n.fy = nhNode.y; }
          else           { n.fx = null; n.fy = null; }
        });

      nodeSel.filter(d => d.type === 'service' && d.nodehost === nhId)
        .transition().duration(280).ease(d3.easeCubicInOut)
        .attr('opacity', collapsed ? 0 : 1)
        .style('pointer-events', collapsed ? 'none' : null);

      linkSel.filter(d => d.linkType === 'node-service' &&
                          (typeof d.source === 'object' ? d.source.id : d.source) === nhId)
        .transition().duration(280).attr('opacity', collapsed ? 0 : 1);

      nodehostCircleRefs.get(nhId)?.attr('stroke-dasharray', collapsed ? '5 3' : '4 2');
      nodehostIndicatorRefs.get(nhId)?.text(collapsed ? '▸' : '▾');

      if (!collapsed) simulation?.alpha(0.25).restart();
    }

    // ── Incremental color + badge update ─────────────────────────────────────
    function updateColors(groups) {
      const groupCounts = {};

      Object.entries(groups).forEach(([gName, gNodes]) => {
        groupCounts[gName] = { up: 0, total: 0 };

        Object.entries(gNodes).forEach(([nodeName, services]) => {
          services.forEach(({ name, available }) => {
            const id       = `${gName}:${nodeName}:${name}`;
            const nodeData = currentGraph?.nodeMap.get(id);
            if (nodeData) nodeData.available = available;
            groupCounts[gName].total++;
            if (available) groupCounts[gName].up++;

            const circle = svcCircleRefs.get(id);
            if (circle) {
              circle
                .classed('unavail-pulse', !available)
                .transition().duration(500)
                .attr('fill',   available ? COLORS.greenFill : COLORS.redFill)
                .attr('stroke', available ? COLORS.green     : COLORS.red);
            }

            const halo = svcHaloRefs.get(id);
            if (halo) {
              halo.transition().duration(500)
                .attr('fill', available ? COLORS.greenHalo : COLORS.redHalo);
            }
          });
        });
      });

      Object.entries(groupCounts).forEach(([g, c]) => {
        groupBadgeRefs.get(g)?.text(`${c.up}/${c.total}`);
      });

      if (currentGraph) refreshNodehostBadges(currentGraph);

      if (cenboPingEl) {
        cenboPingEl
          .attr('r', R.root).attr('opacity', 0.55).attr('stroke-width', 1.5)
          .transition().duration(900).ease(d3.easeCubicOut)
          .attr('r', R.root + 28).attr('opacity', 0).attr('stroke-width', 0.5);
      }
    }

    // ── Header stat counters ──────────────────────────────────────────────────
    function updateHeaderStats(timestamp, groups) {
      Object.entries(groups).forEach(([g, gNodes]) => {
        let up = 0, total = 0;
        Object.values(gNodes).forEach(services => {
          services.forEach(s => { total++; if (s.available) up++; });
        });
        const el = document.getElementById(`${g}-count`);
        if (el) el.textContent = `${up} / ${total}`;
      });
      const t = new Date(timestamp);
      document.getElementById('last-check').textContent = t.toTimeString().slice(0, 8);
    }

    // ── Event log: detect state changes and populate log entries ─────────────
    function detectAndLogChanges(groups, timestamp) {
      const time = new Date(timestamp);
      const timeStr = time.toTimeString().slice(0, 8);
      const changes = [];

      Object.entries(groups).forEach(([gName, gNodes]) => {
        Object.entries(gNodes).forEach(([nodeName, services]) => {
          services.forEach(svc => {
            const id   = `${gName}:${nodeName}:${svc.name}`;
            const prev = prevStatusMap.get(id);
            if (prev !== undefined && prev !== svc.available) {
              changes.push({ id, gName, svc, available: svc.available, timeStr });
            }
            prevStatusMap.set(id, svc.available);
          });
        });
      });

      changes.forEach(({ gName, svc, available, timeStr }) => {
        appendLogEntry(gName, svc, available, timeStr);
      });
    }

    function appendLogEntry(gName, svc, isUp, timeStr, historical = false) {
      const body   = document.getElementById('log-body');
      const empty  = document.getElementById('log-empty');
      const counter = document.getElementById('log-count');
      const meta   = getGroupMeta(gName);

      if (empty) empty.remove();

      logEntryCount++;
      counter.textContent = logEntryCount;

      // Prune oldest entries beyond MAX_LOG_ENTRIES
      const existing = body.querySelectorAll('.log-entry');
      if (existing.length >= MAX_LOG_ENTRIES) {
        existing[existing.length - 1].remove();
        logEntryCount = Math.max(0, logEntryCount - 1);
        counter.textContent = logEntryCount;
      }

      const entry = document.createElement('div');
      entry.className = `log-entry ${isUp ? 'up' : 'down'}`;
      if (historical) entry.style.animation = 'none';

      entry.innerHTML = `
        <div class="log-accent"></div>
        <div class="log-content">
          <div class="log-top">
            <span class="log-service">${escHtml(svc.name)}</span>
            <span class="log-time">${escHtml(timeStr)}</span>
          </div>
          <div class="log-mid">
            <span class="log-group-tag" style="color:${meta.color}">${escHtml(meta.name)}</span>
            <div class="log-sep-dot"></div>
            <span class="log-direction">${isUp ? '↑ came up' : '↓ went down'}</span>
          </div>
          <div class="log-host">${escHtml(svc.node)}:${svc.port}</div>
        </div>
      `;

      // Insert newest at top
      body.insertBefore(entry, body.firstChild);
    }

    async function loadHistoricalLog() {
      try {
        const res = await fetch('/api/log');
        if (!res.ok) return;
        const entries = await res.json();
        // File is oldest-first; prepending in that order leaves newest at top
        entries.forEach(({ group, service, node, port, to, timestamp }) => {
          const timeStr = new Date(timestamp).toTimeString().slice(0, 8);
          appendLogEntry(group, { name: service, node, port }, to, timeStr, true);
        });
      } catch (e) {
        console.error('Failed to load historical log:', e);
      }
    }

    function clearLog() {
      const body  = document.getElementById('log-body');
      const counter = document.getElementById('log-count');
      body.innerHTML = '<div class="log-empty" id="log-empty">Monitoring for changes…</div>';
      logEntryCount = 0;
      counter.textContent = 0;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('log-clear').addEventListener('click', clearLog);

    // ── Handle incoming WebSocket status message ──────────────────────────────
    function handleStatus(msg) {
      document.getElementById('loading').classList.add('hidden');
      updateHeaderStats(msg.timestamp, msg.groups);

      // Detect changes before updating prevStatusMap (done inside detectAndLogChanges)
      if (prevStatusMap.size > 0) {
        detectAndLogChanges(msg.groups, msg.timestamp);
      } else {
        // First message: seed prevStatusMap without logging
        Object.entries(msg.groups).forEach(([gName, gNodes]) => {
          Object.entries(gNodes).forEach(([nodeName, services]) => {
            services.forEach(svc =>
              prevStatusMap.set(`${gName}:${nodeName}:${svc.name}`, svc.available));
          });
        });
      }

      lastGroups = msg.groups;

      if (!rendered) {
        currentGraph = buildGraph(msg.groups);
        seedPositions(currentGraph);
        renderGraph(currentGraph);
        rendered = true;
      } else {
        updateColors(msg.groups);
      }
    }

    // ── WebSocket with auto-reconnect ─────────────────────────────────────────
    let ws, reconnTimer;

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        document.getElementById('conn-dot').classList.remove('off');
        document.getElementById('conn-label').textContent = 'live';
        clearTimeout(reconnTimer);
      };

      ws.onmessage = ({ data }) => {
        try {
          const msg = JSON.parse(data);
          if (msg.type === 'status') handleStatus(msg);
        } catch (_) {}
      };

      ws.onclose = () => {
        document.getElementById('conn-dot').classList.add('off');
        document.getElementById('conn-label').textContent = 'reconnecting';
        reconnTimer = setTimeout(connect, 3000);
      };

      ws.onerror = () => ws.close();
    }

    // ── Resize handler ────────────────────────────────────────────────────────
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const graphArea = document.getElementById('graph-area');
        W = graphArea.clientWidth;
        H = graphArea.clientHeight;
        svg.attr('width', W).attr('height', H);
        svg.select('rect').attr('width', W).attr('height', H);
        if (currentGraph) {
          const cenbo = currentGraph.nodeMap.get('cenbo');
          if (cenbo) { cenbo.fx = W / 2; cenbo.fy = H / 2; }
          simulation
            ?.force('center', d3.forceCenter(W / 2, H / 2).strength(0.04))
            .alpha(0.3).restart();
        }
      }, 200);
    });

    // ── Boot ──────────────────────────────────────────────────────────────────
    document.fonts.ready.then(async () => {
      initSVG();
      await loadHistoricalLog();
      connect();
    });
  </script>
</body>
</html>
