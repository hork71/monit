<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSMON — Infrastructure Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg:            #07090f;
      --surface:       #0c1320;
      --border:        rgba(80, 130, 200, 0.10);
      --text-dim:      #3d5878;
      --text:          #7a9dc0;
      --text-bright:   #b8d4ee;

      --green:         #06d6a0;
      --green-fill:    rgba(6,  214, 160, 0.10);
      --green-glow:    rgba(6,  214, 160, 0.30);

      --red:           #ef233c;
      --red-fill:      rgba(239,  35,  60, 0.10);
      --red-glow:      rgba(239,  35,  60, 0.30);

      --puppet:        #00b4d8;
      --puppet-fill:   rgba(0,  180, 216, 0.06);
      --puppet-stroke: rgba(0,  180, 216, 0.40);

      --gitlab:        #e85d04;
      --gitlab-fill:   rgba(232,  93,   4, 0.06);
      --gitlab-stroke: rgba(232,  93,   4, 0.40);

      --font-display: 'Syne', sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
    }

    /* ── Background layers ─────────────────────────────────────────────────── */

    .bg-grid {
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(80,130,200,0.07) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .radar-sweep {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
      animation: sweep 9s linear infinite;
      transform-origin: 50% 50%;
      background: conic-gradient(from 0deg at 50% 50%,
        transparent 340deg,
        rgba(0, 180, 216, 0.05) 353deg,
        rgba(0, 180, 216, 0.01) 360deg
      );
    }

    @keyframes sweep { to { transform: rotate(360deg); } }

    .scanlines {
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent 3px,
        rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 900;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */

    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 9, 15, 0.88);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 34px; height: 34px;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text-bright);
      line-height: 1;
    }

    .brand-name em {
      color: var(--puppet);
      font-style: normal;
    }

    .brand-sub {
      font-size: 8.5px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .stat-label {
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .stat-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-bright);
      letter-spacing: 0.02em;
    }

    .stat-val.puppet { color: var(--puppet); }
    .stat-val.gitlab { color: var(--gitlab); }

    .hdivider {
      width: 1px;
      height: 30px;
      background: var(--border);
    }

    .conn {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .conn-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
      flex-shrink: 0;
      transition: background 0.35s, box-shadow 0.35s;
    }

    .conn-dot.off {
      background: var(--red);
      box-shadow: 0 0 10px var(--red-glow);
      animation: blink 1.1s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.25; }
    }

    /* ── Main / SVG ────────────────────────────────────────────────────────── */

    main {
      flex: 1;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    #chart { width: 100%; height: 100%; display: block; }

    /* ── Loading overlay ───────────────────────────────────────────────────── */

    .loading {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 50;
      transition: opacity 0.5s ease;
      background: var(--bg);
    }

    .loading.hidden { opacity: 0; pointer-events: none; }

    .loading-ring {
      width: 52px; height: 52px;
      border: 2px solid rgba(0, 180, 216, 0.12);
      border-top-color: var(--puppet);
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ── Legend ────────────────────────────────────────────────────────────── */

    .legend {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 22px;
      align-items: center;
      padding: 8px 20px;
      background: rgba(12, 19, 32, 0.88);
      border: 1px solid var(--border);
      border-radius: 2px;
      backdrop-filter: blur(10px);
      z-index: 20;
      white-space: nowrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 8.5px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .pip {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Tooltip ───────────────────────────────────────────────────────────── */

    #tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.12s;
      background: rgba(12, 19, 32, 0.96);
      border: 1px solid rgba(80, 130, 200, 0.18);
      border-radius: 3px;
      padding: 10px 14px;
      backdrop-filter: blur(12px);
      min-width: 140px;
    }

    #tooltip.show { opacity: 1; }

    .tt-name {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 3px;
      line-height: 1;
    }

    .tt-node {
      font-size: 10px;
      color: var(--text);
      margin-bottom: 2px;
      font-style: italic;
      letter-spacing: 0.01em;
    }

    .tt-port {
      font-size: 10.5px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .tt-status {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .tt-status.up   { color: var(--green); }
    .tt-status.down { color: var(--red);   }

    /* ── SVG circle animations ─────────────────────────────────────────────── */

    @keyframes pulse-down {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.38; }
    }

    @keyframes breathe-up {
      0%, 100% { opacity: 0.70; }
      50%       { opacity: 0.25; }
    }

    .anim-down { animation: pulse-down 1.5s ease-in-out infinite; }
    .anim-up   { animation: breathe-up 3.2s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="radar-sweep"></div>
  <div class="scanlines"></div>

  <header>
    <div class="brand">
      <!-- Radar / target icon -->
      <svg class="brand-icon" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="15.5" stroke="rgba(0,180,216,0.22)" stroke-width="1"/>
        <circle cx="17" cy="17" r="10"   stroke="rgba(0,180,216,0.35)" stroke-width="1"/>
        <circle cx="17" cy="17" r="4.5"  stroke="rgba(0,180,216,0.55)" stroke-width="1"/>
        <circle cx="17" cy="17" r="2"    fill="#00b4d8"/>
        <line x1="17" y1="1.5"  x2="17" y2="7"   stroke="#00b4d8" stroke-width="1.4"/>
        <line x1="17" y1="27"   x2="17" y2="32.5" stroke="rgba(0,180,216,0.25)" stroke-width="1"/>
        <line x1="1.5" y1="17"  x2="7"   y2="17"  stroke="rgba(0,180,216,0.25)" stroke-width="1"/>
        <line x1="27"  y1="17"  x2="32.5" y2="17" stroke="rgba(0,180,216,0.25)" stroke-width="1"/>
      </svg>
      <div>
        <div class="brand-name">SYS<em>MON</em></div>
        <div class="brand-sub">Infrastructure Monitor</div>
      </div>
    </div>

    <div class="header-right">
      <div class="stat">
        <span class="stat-label">Puppet</span>
        <span class="stat-val puppet" id="puppet-count">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">GitLab</span>
        <span class="stat-val gitlab" id="gitlab-count">—</span>
      </div>
      <div class="hdivider"></div>
      <div class="stat">
        <span class="stat-label">Last Check</span>
        <span class="stat-val" id="last-check">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Interval</span>
        <span class="stat-val">10 s</span>
      </div>
      <div class="hdivider"></div>
      <div class="conn">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-label">connecting</span>
      </div>
    </div>
  </header>

  <main>
    <svg id="chart"></svg>

    <div class="loading" id="loading">
      <div class="loading-ring"></div>
      <div class="loading-text">Running initial diagnostics…</div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="pip" style="background:var(--puppet);opacity:.75;"></div>
        Puppet
      </div>
      <div class="legend-item">
        <div class="pip" style="background:var(--gitlab);opacity:.75;"></div>
        GitLab
      </div>
      <div class="legend-item">
        <div class="pip" style="background:var(--green);box-shadow:0 0 6px var(--green-glow);"></div>
        Available
      </div>
      <div class="legend-item">
        <div class="pip" style="background:var(--red);box-shadow:0 0 6px var(--red-glow);"></div>
        Unavailable
      </div>
    </div>
  </main>

  <div id="tooltip">
    <div class="tt-name"   id="tt-name"></div>
    <div class="tt-node"   id="tt-node"></div>
    <div class="tt-port"   id="tt-port"></div>
    <div class="tt-status" id="tt-status"></div>
  </div>

  <script>
    // ── Design tokens ────────────────────────────────────────────────────────
    const C = {
      green:      '#06d6a0',
      greenFill:  'rgba(6,214,160,0.10)',
      greenGlow:  'rgba(6,214,160,0.28)',
      red:        '#ef233c',
      redFill:    'rgba(239,35,60,0.10)',
      redGlow:    'rgba(239,35,60,0.28)',
      group: {
        puppet: { fill: 'rgba(0,180,216,0.055)', stroke: 'rgba(0,180,216,0.38)', label: '#00b4d8' },
        gitlab: { fill: 'rgba(232,93,4,0.055)',  stroke: 'rgba(232,93,4,0.38)',  label: '#e85d04' },
      },
      cebo: { fill: 'rgba(201,168,76,0.04)', stroke: 'rgba(201,168,76,0.42)', label: '#d4b870' },
    };

    // ── State ────────────────────────────────────────────────────────────────
    let svg, packG;
    let W = 0, H = 0;
    let rendered   = false;
    let lastGroups = null;

    // key → { glowEl, circleEl, textEls, available }
    const svcRefs = new Map();

    // ── Build D3 hierarchy from status groups ────────────────────────────────
    // root (hidden) → cebo (central) → puppet/gitlab (groups) → services
    function buildHierarchy(groups) {
      return {
        name: 'root',
        children: [{
          name: 'cebo',
          isCebo: true,
          children: Object.entries(groups).map(([gName, svcs]) => ({
            name: gName,
            isGroup: true,
            children: svcs.map(s => ({ ...s, value: 1 })),
          })),
        }],
      };
    }

    // ── Compute circle-pack layout ───────────────────────────────────────────
    function computePack(groups, w, h) {
      const root = d3.hierarchy(buildHierarchy(groups)).sum(d => d.value || 0);
      d3.pack().size([w, h]).padding(n => {
        if (n.depth === 0) return 20;  // root → cebo
        if (n.depth === 1) return 36;  // cebo → groups
        return 18;                     // groups → services
      })(root);
      return root;
    }

    // ── Full render (first paint) ────────────────────────────────────────────
    function fullRender(groups) {
      svcRefs.clear();
      packG.selectAll('*').remove();

      const root = computePack(groups, W, H);

      root.descendants().forEach(pn => {
        if (pn.depth === 0) return;

        const g = packG.append('g')
          .attr('transform', `translate(${pn.x},${pn.y})`);

        if (pn.depth === 1) {
          // ── Cebo central circle ───────────────────────────────────────────
          // Outermost dashed ring
          g.append('circle')
            .attr('r', pn.r + 12)
            .attr('fill', 'none')
            .attr('stroke', 'rgba(201,168,76,0.15)')
            .attr('stroke-width', 1)
            .attr('stroke-dasharray', '3 9');

          // Inner accent ring
          g.append('circle')
            .attr('r', pn.r + 4)
            .attr('fill', 'none')
            .attr('stroke', 'rgba(201,168,76,0.28)')
            .attr('stroke-width', 1);

          // Main cebo fill
          g.append('circle')
            .attr('r', pn.r)
            .attr('fill', C.cebo.fill)
            .attr('stroke', C.cebo.stroke)
            .attr('stroke-width', 1.5);

          // CEBO label at top of circle
          const lsz = Math.max(13, Math.min(24, pn.r * 0.07));
          g.append('text')
            .attr('y', -pn.r + lsz + 16)
            .attr('text-anchor', 'middle')
            .attr('font-family', "'Syne', sans-serif")
            .attr('font-size', lsz)
            .attr('font-weight', '800')
            .attr('letter-spacing', '0.24em')
            .attr('fill', C.cebo.label)
            .attr('opacity', 0.88)
            .text('CEBO');

        } else if (pn.depth === 2) {
          // ── Group circle (puppet / gitlab) ────────────────────────────────
          const st = C.group[pn.data.name] || C.group.puppet;

          // Outer decorative ring
          g.append('circle')
            .attr('r', pn.r + 8)
            .attr('fill', 'none')
            .attr('stroke', st.stroke)
            .attr('stroke-width', 0.75)
            .attr('opacity', 0.28);

          // Group fill + border
          g.append('circle')
            .attr('r', pn.r)
            .attr('fill', st.fill)
            .attr('stroke', st.stroke)
            .attr('stroke-width', 1.5);

          // Group label
          const lsz = Math.max(11, Math.min(17, pn.r * 0.10));
          g.append('text')
            .attr('y', -pn.r + lsz + 12)
            .attr('text-anchor', 'middle')
            .attr('font-family', "'Syne', sans-serif")
            .attr('font-size', lsz)
            .attr('font-weight', '800')
            .attr('letter-spacing', '0.16em')
            .attr('fill', st.label)
            .attr('opacity', 0.92)
            .text(pn.data.name.toUpperCase());

        } else if (pn.depth === 3) {
          // ── Service circle ────────────────────────────────────────────────
          const groupName = pn.parent.data.name;
          const { name, node: hostname, port, available } = pn.data;
          const key   = `${groupName}:${name}`;
          const color = available ? C.green : C.red;
          const fill  = available ? C.greenFill : C.redFill;
          const glow  = available ? C.greenGlow : C.redGlow;

          // Outer glow halo
          const glowEl = g.append('circle')
            .attr('r', pn.r + 5)
            .attr('fill', glow)
            .attr('class', available ? 'anim-up' : 'anim-down');

          // Main service circle
          const circleEl = g.append('circle')
            .attr('r', pn.r)
            .attr('fill', fill)
            .attr('stroke', color)
            .attr('stroke-width', 1.5);

          if (!available) circleEl.classed('anim-down', true);

          // Center status dot
          g.append('circle')
            .attr('r', Math.max(2, pn.r * 0.09))
            .attr('fill', color)
            .attr('opacity', 0.85);

          // Text labels
          const fsz  = Math.max(8, Math.min(12, pn.r * 0.27));
          const textEls = [];

          if (pn.r > 22) {
            const hasPort = pn.r > 36;
            const nameY   = hasPort ? -fsz * 0.65 : 0;

            const nameEl = g.append('text')
              .attr('y', nameY)
              .attr('text-anchor', 'middle')
              .attr('dominant-baseline', 'central')
              .attr('font-family', "'JetBrains Mono', monospace")
              .attr('font-size', fsz)
              .attr('font-weight', '500')
              .attr('fill', color)
              .attr('opacity', 0.95)
              .text(name);
            textEls.push(nameEl);

            if (hasPort) {
              const portEl = g.append('text')
                .attr('y', fsz * 0.90)
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .attr('font-family', "'JetBrains Mono', monospace")
                .attr('font-size', Math.max(7, fsz * 0.70))
                .attr('fill', color)
                .attr('opacity', 0.42)
                .text(`:${port}`);
              textEls.push(portEl);
            }
          }

          // Store reference for incremental color updates
          svcRefs.set(key, { glowEl, circleEl, textEls, available, hostname });

          // Tooltip interactions
          const tooltip = document.getElementById('tooltip');
          g.style('cursor', 'default')
            .on('mouseenter', () => {
              const ref = svcRefs.get(key);
              const av  = ref ? ref.available : available;
              document.getElementById('tt-name').textContent = name;
              document.getElementById('tt-node').textContent = ref ? ref.hostname : hostname;
              document.getElementById('tt-port').textContent = `TCP :${port}`;
              const statusEl = document.getElementById('tt-status');
              statusEl.textContent = av ? '● ONLINE' : '● OFFLINE';
              statusEl.className   = `tt-status ${av ? 'up' : 'down'}`;
              tooltip.classList.add('show');
            })
            .on('mousemove', (ev) => {
              tooltip.style.left = `${ev.clientX + 16}px`;
              tooltip.style.top  = `${ev.clientY - 12}px`;
            })
            .on('mouseleave', () => tooltip.classList.remove('show'));
        }
      });
    }

    // ── Incremental color update (subsequent status pushes) ──────────────────
    function updateColors(groups) {
      Object.entries(groups).forEach(([groupName, svcs]) => {
        svcs.forEach(({ name, available }) => {
          const key = `${groupName}:${name}`;
          const ref = svcRefs.get(key);
          if (!ref) return;

          ref.available = available;

          const color = available ? C.green : C.red;
          const fill  = available ? C.greenFill : C.redFill;
          const glow  = available ? C.greenGlow : C.redGlow;

          ref.glowEl
            .classed('anim-up',   available)
            .classed('anim-down', !available)
            .transition().duration(500).attr('fill', glow);

          ref.circleEl
            .classed('anim-down', !available)
            .transition().duration(500)
            .attr('fill', fill)
            .attr('stroke', color);

          ref.textEls.forEach(el =>
            el.transition().duration(500).attr('fill', color)
          );
        });
      });
    }

    // ── Update header stats display ──────────────────────────────────────────
    function updateStats(timestamp, groups) {
      Object.entries(groups).forEach(([group, svcs]) => {
        const up  = svcs.filter(s => s.available).length;
        const el  = document.getElementById(`${group}-count`);
        if (el) el.textContent = `${up} / ${svcs.length}`;
      });

      const t = new Date(timestamp);
      document.getElementById('last-check').textContent =
        t.toTimeString().slice(0, 8);
    }

    // ── Initialise SVG canvas ────────────────────────────────────────────────
    function initSVG() {
      const main = document.querySelector('main');
      W = main.clientWidth;
      H = main.clientHeight;

      svg = d3.select('#chart').attr('width', W).attr('height', H);

      // Dark background rect
      svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#07090f');

      // Decorative concentric rings
      const cx = W / 2, cy = H / 2;
      const baseR = Math.min(W, H) * 0.47;
      const ringsG = svg.append('g');
      [0.38, 0.60, 0.80, 1.0].forEach(f => {
        ringsG.append('circle')
          .attr('cx', cx).attr('cy', cy).attr('r', baseR * f)
          .attr('fill', 'none')
          .attr('stroke', 'rgba(80,130,200,0.04)')
          .attr('stroke-width', 1)
          .attr('stroke-dasharray', '4 10');
      });

      packG = svg.append('g');
    }

    // ── Handle incoming status message ───────────────────────────────────────
    function handleStatus(msg) {
      lastGroups = msg.groups;
      document.getElementById('loading').classList.add('hidden');
      updateStats(msg.timestamp, msg.groups);

      if (!rendered) {
        fullRender(msg.groups);
        rendered = true;
      } else {
        updateColors(msg.groups);
      }
    }

    // ── WebSocket client with auto-reconnect ─────────────────────────────────
    let ws, reconnTimer;

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        document.getElementById('conn-dot').classList.remove('off');
        document.getElementById('conn-label').textContent = 'live';
        clearTimeout(reconnTimer);
      };

      ws.onmessage = ({ data }) => {
        try {
          const msg = JSON.parse(data);
          if (msg.type === 'status') handleStatus(msg);
        } catch (_) {}
      };

      ws.onclose = () => {
        document.getElementById('conn-dot').classList.add('off');
        document.getElementById('conn-label').textContent = 'reconnecting';
        reconnTimer = setTimeout(connect, 3000);
      };

      ws.onerror = () => ws.close();
    }

    // ── Resize: re-run full layout with new dimensions ───────────────────────
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const main = document.querySelector('main');
        W = main.clientWidth;
        H = main.clientHeight;
        svg.attr('width', W).attr('height', H);
        if (lastGroups) {
          rendered = false;
          fullRender(lastGroups);
          rendered = true;
        }
      }, 180);
    });

    // ── Boot ─────────────────────────────────────────────────────────────────
    document.fonts.ready.then(() => {
      initSVG();
      connect();
    });
  </script>
</body>
</html>
